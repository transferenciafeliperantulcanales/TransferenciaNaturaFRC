<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">

  <title>Datos de Transferencia - Natura</title>
  <link rel="icon" href="https://images.ctfassets.net/wtpc7vtprhhe/6G5iI1R2jK2yY62g0k86e6/1c828e8d8d7b322e70e7e0e7e108848f/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #ff9e6c;
      background-image: linear-gradient(135deg, #ffab7d 0%, #f48248 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    .wrapper { 
      width: 100%; 
      max-width: 440px; 
      position: relative; 
      z-index: 2; 
      text-align: center;
    }

    .header-natura {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-badge {
      background: #ffffff;
      padding: 16px 28px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      max-height: 55px;
      width: auto;
      object-fit: contain;
    }

    .contenedor-tarjetas {
      display: flex;
      flex-direction: column;
      margin-bottom: 28px;
      background-color: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      text-align: left;
    }

    .tarjeta {
      background-color: #ffffff;
      border-bottom: 1px solid #f2f2f2;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tarjeta:last-child { border-bottom: none; }

    .etiqueta {
      font-size: 0.65rem;
      font-weight: 500;
      color: #8c8c8c;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .valor {
      font-size: 0.86rem;
      font-weight: 600;
      color: #1a1a1a;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Botón flotante con volumen, sombra profunda y brillo táctil */
    .btn-copiar {
      width: 100%;
      background: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #e65500;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 20px 16px;
      font-size: 0.88rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      /* Sombra intensa multicapa para dar efecto de relieve flotante */
      box-shadow: 
        0 14px 28px rgba(180, 50, 0, 0.35), 
        0 6px 12px rgba(0, 0, 0, 0.15);
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* Sombra de acento interna y resplandor al interactuar */
    .btn-copiar:hover {
      background-color: #ffffff;
      transform: translateY(-4px);
      box-shadow: 
        0 20px 38px rgba(180, 50, 0, 0.45), 
        0 10px 16px rgba(0, 0, 0, 0.2);
    }

    /* Feedback de pulso táctil inmediato al presionar en celular */
    .btn-copiar:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 
        0 6px 14px rgba(180, 50, 0, 0.3), 
        0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .mensaje {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      color: #ffffff;
      background-color: #1a1a1a;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      border-radius: 16px;
      padding: 16px 26px;
      font-size: 0.85rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-natura">
      <div class="logo-badge">
        <img src="logo.png" alt="Natura Logo" class="logo-img">
      </div>
    </div>

    <div class="contenedor-tarjetas">
      <div class="tarjeta"><span class="etiqueta">Titular:</span><span class="valor">Felipe Ignacio Rantul Canales</span></div>
      <div class="tarjeta"><span class="etiqueta">RUT:</span><span class="valor">20.254.963-2</span></div>
      <div class="tarjeta"><span class="etiqueta">Banco:</span><span class="valor">Banco Santander</span></div>
      <div class="tarjeta"><span class="etiqueta">Tipo de Cuenta:</span><span class="valor">Cuenta Corriente</span></div>
      <div class="tarjeta"><span class="etiqueta">Número de Cuenta:</span><span class="valor">000074818609</span></div>
      <div class="tarjeta"><span class="etiqueta">Correo:</span><span class="valor">felipe.rc9@icloud.com</span></div>
    </div>

    <button class="btn-copiar" onclick="copiarDatos()">
      Copiar datos de transferencia
    </button>
  </div>

  <div id="mensaje-flotante" class="mensaje">¡Datos copiados!</div>

  <script src="script.js?v=natura12"></script>
</body>
</html>
