<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">

  <title>Datos de Transferencia - Natura</title>
  <link rel="icon" href="https://images.ctfassets.net/wtpc7vtprhhe/6G5iI1R2jK2yY62g0k86e6/1c828e8d8d7b322e70e7e0e7e108848f/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      /* Ambiente premium inspirado en la identidad visual de Natura Chile: tonos naturales, suaves y orgánicos */
      background-color: #f4f0ea;
      background-image: 
        radial-gradient(#e2d7c7 1px, transparent 1px),
        radial-gradient(#e2d7c7 1px, #f4f0ea 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: #2b332f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    .wrapper { 
      width: 100%; 
      max-width: 440px; 
      position: relative; 
      z-index: 2; 
      text-align: center;
    }

    /* Cabecera elegante y marcada con la identidad de marca */
    .header-natura {
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: #ffffff;
      padding: 12px 28px;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(43, 51, 47, 0.08);
      border: 1px solid #ebe4d8;
    }

    .logo-natura {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ff6200; /* Naranja corporativo vibrante de Natura */
      letter-spacing: 5px;
      text-transform: lowercase;
      line-height: 1;
    }

    .subtitulo-principal {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: #ffffff;
      background: linear-gradient(135deg, #2b4436, #1b2c22); /* Verde hoja profundo muy característico */
      border-radius: 30px;
      padding: 8px 22px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(43, 68, 54, 0.25);
    }

    /* Tarjetas de datos con diseño moderno flotante */
    .contenedor-tarjetas {
      display: flex;
      flex-direction: column;
      margin-bottom: 24px;
      background-color: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(43, 51, 47, 0.08);
      border: 1px solid #ebe4d8;
      text-align: left;
    }

    .tarjeta {
      background-color: transparent;
      border-bottom: 1px solid #f5f1eb;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: background-color 0.2s ease;
    }

    .tarjeta:hover {
      background-color: #faf8f5;
    }

    .tarjeta:last-child { border-bottom: none; }

    .etiqueta {
      font-size: 0.65rem;
      font-weight: 500;
      color: #8c7d70;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .valor {
      font-size: 0.86rem;
      font-weight: 600;
      color: #1a231f;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Botón principal estilizado con degradado y efectos de profundidad */
    .btn-copiar {
      width: 100%;
      background: linear-gradient(135deg, #ff6200, #e05500);
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 18px 16px;
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      box-shadow: 0 10px 25px rgba(255, 98, 0, 0.35);
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-copiar:hover {
      background: linear-gradient(135deg, #e05500, #c44a00);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(255, 98, 0, 0.45);
    }

    .btn-copiar:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(255, 98, 0, 0.3);
    }

    .mensaje {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      color: #ffffff;
      background-color: #2b4436;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      border-radius: 16px;
      padding: 16px 26px;
      font-size: 0.85rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-natura">
      <div class="logo-badge">
        <div class="logo-natura">natura</div>
      </div>
      <div class="subtitulo-principal">Consultoría Oficial</div>
    </div>

    <div class="contenedor-tarjetas">
      <div class="tarjeta"><span class="etiqueta">Titular / Razón Social:</span><span class="valor">Felipe Ignacio Rantul Canales</span></div>
      <div class="tarjeta"><span class="etiqueta">RUT:</span><span class="valor">20.254.963-2</span></div>
      <div class="tarjeta"><span class="etiqueta">Banco:</span><span class="valor">Banco Santander</span></div>
      <div class="tarjeta"><span class="etiqueta">Tipo de Cuenta:</span><span class="valor">Cuenta Corriente</span></div>
      <div class="tarjeta"><span class="etiqueta">Número de Cuenta:</span><span class="valor">000074818609</span></div>
      <div class="tarjeta"><span class="etiqueta">Correo:</span><span class="valor">felipe.rc9@icloud.com</span></div>
    </div>

    <button class="btn-copiar" onclick="copiarDatos()">
      Copiar datos de transferencia
    </button>
  </div>

  <div id="mensaje-flotante" class="mensaje">¡Datos copiados!</div>

  <script src="script.js?v=natura6"></script>
</body>
</html>
