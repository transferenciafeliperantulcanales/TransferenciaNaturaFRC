<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">

  <title>Datos de Transferencia - Natura</title>
  <link rel="icon" href="https://images.ctfassets.net/wtpc7vtprhhe/6G5iI1R2jK2yY62g0k86e6/1c828e8d8d7b322e70e7e0e7e108848f/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      /* Ambiente natural y sofisticado con tonos tierra, arena y acentos ecológicos de la marca */
      background-color: #f7f3ed;
      background-image: 
        radial-gradient(#e5dbcc 1.5px, transparent 1.5px),
        radial-gradient(#e5dbcc 1.5px, #f7f3ed 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: #2c3531;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .wrapper { 
      width: 100%; 
      max-width: 440px; 
      position: relative; 
      z-index: 2; 
      text-align: center;
    }

    /* Cabecera elegante inspirada en la marca */
    .header-natura {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-natura {
      font-size: 2.4rem;
      font-weight: 700;
      color: #ff6a00;
      letter-spacing: 4px;
      text-transform: lowercase;
      text-shadow: 0 2px 10px rgba(255, 106, 0, 0.15);
    }

    .subtitulo-principal {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: #ffffff;
      background: linear-gradient(135deg, #2d4436, #1e2e24);
      border-radius: 20px;
      padding: 8px 20px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(45, 68, 54, 0.2);
    }

    /* Tarjetas con estilo orgánico y bordes suaves */
    .contenedor-tarjetas {
      display: flex;
      flex-direction: column;
      margin-bottom: 24px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(44, 53, 49, 0.08);
      border: 1px solid rgba(229, 219, 204, 0.8);
      text-align: left;
    }

    .tarjeta {
      background-color: transparent;
      border-bottom: 1px solid #f2ece4;
      padding: 15px 22px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tarjeta:last-child { border-bottom: none; }

    .etiqueta {
      font-size: 0.65rem;
      font-weight: 500;
      color: #8a7d72;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .valor {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1f2724;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Botón principal orgánico y llamativo */
    .btn-copiar {
      width: 100%;
      background: linear-gradient(135deg, #ff6a00, #e65c00);
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 18px 16px;
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      box-shadow: 0 8px 25px rgba(255, 106, 0, 0.35);
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-copiar:hover {
      background: linear-gradient(135deg, #e65c00, #cc5200);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 106, 0, 0.45);
    }

    .btn-copiar:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(255, 106, 0, 0.3);
    }

    .mensaje {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      color: #ffffff;
      background-color: #2d4436;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      border-radius: 14px;
      padding: 16px 26px;
      font-size: 0.85rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-natura">
      <div class="logo-natura">natura</div>
      <div class="subtitulo-principal">Consultoría Oficial</div>
    </div>

    <div class="contenedor-tarjetas">
      <div class="tarjeta"><span class="etiqueta">Titular / Razón Social:</span><span class="valor">Felipe Ignacio Rantul Canales</span></div>
      <div class="tarjeta"><span class="etiqueta">RUT:</span><span class="valor">20.254.963-2</span></div>
      <div class="tarjeta"><span class="etiqueta">Banco:</span><span class="valor">Banco Santander</span></div>
      <div class="tarjeta"><span class="etiqueta">Tipo de Cuenta:</span><span class="valor">Cuenta Corriente</span></div>
      <div class="tarjeta"><span class="etiqueta">Número de Cuenta:</span><span class="valor">000074818609</span></div>
      <div class="tarjeta"><span class="etiqueta">Correo:</span><span class="valor">felipe.rc9@icloud.com</span></div>
    </div>

    <button class="btn-copiar" onclick="copiarDatos()">
      Copiar datos de transferencia
    </button>
  </div>

  <div id="mensaje-flotante" class="mensaje">¡Datos copiados!</div>

  <script src="script.js?v=natura5"></script>
</body>
</html>
